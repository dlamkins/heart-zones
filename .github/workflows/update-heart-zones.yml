name: Update heart zones

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [minor, patch, major]
        default: minor
      force:
        description: Publish a release even if nothing changed
        type: boolean
        default: false
  repository_dispatch:
    types: [update-heart-zones]
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "_markerCategories.xml"
      - "boundary.png"
      - ".github/workflows/update-heart-zones.yml"

permissions:
  contents: write

concurrency:
  group: update-heart-zones

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump || github.event.client_payload.bump || 'minor' }}
      FORCE: ${{ inputs.force || github.event.client_payload.force || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate trails
        run: python generator/generate.py

      - name: Commit generated files
        run: |
          git add -A -- 'map*.xml' trails
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update heart zones from the GW2 API"
            git push
          fi

      - name: Download the latest release
        id: previous
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern HeartZones.taco --dir "$RUNNER_TEMP/previous"
          fi

      - name: Package
        id: package
        run: |
          python generator/release.py \
            --out "$RUNNER_TEMP/dist/HeartZones.taco" \
            --notes "$RUNNER_TEMP/dist/notes.md" \
            --previous "$RUNNER_TEMP/previous/HeartZones.taco" \
            --previous-tag "${{ steps.previous.outputs.tag }}" \
            --bump "$BUMP" \
            $([ "$FORCE" = "true" ] && echo --force)
          cat "$RUNNER_TEMP/dist/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: steps.package.outputs.changed == 'true'
        run: |
          gh release create "${{ steps.package.outputs.version }}" "$RUNNER_TEMP/dist/HeartZones.taco" \
            --title "${{ steps.package.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/dist/notes.md" \
            --target "$(git rev-parse HEAD)"
